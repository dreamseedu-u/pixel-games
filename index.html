<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>PIXEL HUNTER - 로그라이트 자동사냥</title>
<style>
:root{--u:2px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#0b0c14;overflow:hidden;touch-action:none;color:#f4f4f4;
font-family:"Galmuri11","DungGeunMo","NeoDunggeunmo","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#1a1c2c;box-shadow:0 0 60px #000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);
padding:calc(var(--u)*8);background:rgba(10,11,20,.84);z-index:5;text-align:center}
.ov.show{display:flex;animation:fade .2s}
.ov.clear{background:transparent;justify-content:flex-end;padding-bottom:calc(var(--u)*22)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hd{font-size:calc(var(--u)*11);font-weight:900;color:#ffcd75;letter-spacing:calc(var(--u)*.4);
text-shadow:0 var(--u) 0 #b13e53,0 calc(var(--u)*2) 0 #1a1c2c,var(--u) 0 0 #1a1c2c,calc(var(--u)*-1) 0 0 #1a1c2c}
.sub{font-size:calc(var(--u)*5.5);color:#94b0c2;line-height:1.5}
.btn{font:inherit;font-weight:800;font-size:calc(var(--u)*7);color:#f4f4f4;background:#3b5dc9;border:none;cursor:pointer;
padding:calc(var(--u)*4) calc(var(--u)*8);min-width:62%;
box-shadow:inset 0 calc(var(--u)*-2) 0 #29366f,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #f4f4f4}
.btn:active{transform:translateY(var(--u));box-shadow:inset 0 calc(var(--u)*-1) 0 #29366f,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #f4f4f4}
.btn.gold{background:#ef7d57;box-shadow:inset 0 calc(var(--u)*-2) 0 #b13e53,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #ffcd75}
.btn.gray{background:#566c86;box-shadow:inset 0 calc(var(--u)*-2) 0 #333c57,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #94b0c2}
.btn.sm{font-size:calc(var(--u)*5.5);padding:calc(var(--u)*2.5) calc(var(--u)*5);min-width:0}
.btn[disabled]{opacity:.4}
#cards{display:flex;flex-direction:column;gap:calc(var(--u)*4);width:100%;max-height:68%;overflow-y:auto;touch-action:pan-y}
.card{--rc:#94b0c2;display:flex;align-items:center;gap:calc(var(--u)*5);background:#232843;padding:calc(var(--u)*5);text-align:left;cursor:pointer;
border:calc(var(--u)*1.5) solid var(--rc);box-shadow:0 0 0 var(--u) #1a1c2c,inset 0 calc(var(--u)*-2) 0 #1a1c2c;animation:pop .35s both}
.card:active{transform:scale(.97)}
.card img{width:calc(var(--u)*24);height:calc(var(--u)*24);image-rendering:pixelated;flex:none;background:#1a1c2c;padding:calc(var(--u)*3);border:var(--u) solid var(--rc)}
.card .rr{font-size:calc(var(--u)*4.5);color:var(--rc);font-weight:800}
.card .nm{font-size:calc(var(--u)*7);font-weight:800;margin-top:calc(var(--u)*.5)}
.card .ds{font-size:calc(var(--u)*5.2);color:#c8d3e0;margin-top:var(--u);line-height:1.35}
.card.r3{animation:pop .35s both,glow .8s .35s infinite alternate}
.card.r2{background:#2a2346}
@keyframes pop{from{transform:scale(.6) translateY(calc(var(--u)*10));opacity:0}to{transform:none;opacity:1}}
@keyframes glow{to{box-shadow:0 0 calc(var(--u)*9) #ffcd75,0 0 0 var(--u) #1a1c2c}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2) calc(var(--u)*6);font-size:calc(var(--u)*5.5);width:100%;
background:#232843;padding:calc(var(--u)*5);text-align:left;box-shadow:0 0 0 var(--u) #566c86}
.stats b{color:#ffcd75;float:right}
.shoplist{width:100%;max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:calc(var(--u)*3);touch-action:pan-y}
.srow{display:flex;align-items:center;gap:calc(var(--u)*4);background:#232843;padding:calc(var(--u)*3) calc(var(--u)*4);text-align:left;box-shadow:0 0 0 var(--u) #566c86}
.srow img{width:calc(var(--u)*16);height:calc(var(--u)*16);image-rendering:pixelated;flex:none}
.srow .nm{font-size:calc(var(--u)*6);font-weight:800}
.srow .nm span{color:#73eff7;font-size:calc(var(--u)*4.5);margin-left:calc(var(--u)*2)}
.srow .ds{font-size:calc(var(--u)*4.8);color:#94b0c2}
.srow .btn{margin-left:auto;white-space:nowrap}
.soul{color:#73eff7;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4);width:100%}
.tile{font:inherit;color:#f4f4f4;background:#232843;border:none;cursor:pointer;display:flex;align-items:center;gap:calc(var(--u)*3);
padding:calc(var(--u)*3.5) calc(var(--u)*4);box-shadow:inset 0 calc(var(--u)*-2) 0 #1a1c2c,0 0 0 var(--u) #566c86;text-align:left}
.tile:active{transform:translateY(var(--u))}
.tile img{width:calc(var(--u)*13);height:calc(var(--u)*13);image-rendering:pixelated;flex:none}
.tile{flex-direction:column;text-align:center;gap:var(--u)!important;padding:calc(var(--u)*3) calc(var(--u)*2)!important}.tile b{display:block;font-size:calc(var(--u)*5.6)}.tile small{display:block;font-size:calc(var(--u)*3.8);color:#94b0c2}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*2)}
.chip{font-size:calc(var(--u)*4.8);padding:var(--u) calc(var(--u)*3);background:rgba(26,28,44,.85);box-shadow:0 0 0 var(--u) #333c57;white-space:nowrap}
.chip b{color:#ffcd75}
.sec{width:100%;text-align:left;font-size:calc(var(--u)*4.6);color:#94b0c2;margin-bottom:calc(var(--u)*-2)}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:calc(var(--u)*2);width:100%}
.stat3 div{background:#232843;padding:calc(var(--u)*2) calc(var(--u)*2.5);font-size:calc(var(--u)*4.4);color:#94b0c2;box-shadow:0 0 0 var(--u) #333c57}
.stat3 b{display:block;font-size:calc(var(--u)*6);color:#f4f4f4}
.build{width:100%;background:#232843;box-shadow:0 0 0 var(--u) #333c57;font-size:calc(var(--u)*4.8);text-align:left}
.build div{display:flex;gap:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:var(--u) solid #1a1c2c}

.build span{flex:none;width:calc(var(--u)*17);color:#94b0c2}
.build em{font-style:normal;line-height:1.35}
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:6;pointer-events:none;font-weight:800;
font-size:calc(var(--u)*6);padding:calc(var(--u)*2) calc(var(--u)*6);background:rgba(26,28,44,.85);box-shadow:0 0 0 var(--u) #94b0c2;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
.row{display:flex;gap:calc(var(--u)*4);justify-content:center;width:100%}
.big{font-size:calc(var(--u)*8);font-weight:900}

<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="toast"></div>

  <div class="ov clear" id="ovTitle" style="padding-bottom:calc(var(--u)*12)">
    <div class="chips" id="titleInfo"></div>
    <button class="btn gold" id="bCont" style="display:none">▶ 이어하기</button>
    <button class="btn gold" id="bStart">▶ 사냥 시작</button>
    <div class="tiles">
      <button class="tile" id="bShop1"><img data-ic="coin2"><span><b>영혼 강화</b><small>영구 능력 강화</small></span></button>
      <button class="tile" id="bEquip1"><img data-ic="sword"><span><b>장비</b><small>무기·갑옷·방패·장신구</small></span></button>
      <button class="tile" id="bPet1"><img data-pet="dragon"><span><b>펫</b><small>동행·진화</small></span></button>
            <button class="tile" id="bSet1"><img data-ic="gem"><span><b>설정</b><small>소리·진동·화면</small></span></button>
    </div>
  </div>

  <div class="ov" id="ovTree">

    <div class="sub" id="treeInfo"></div>
    <div class="shoplist" id="treeList" style="max-height:62%"></div>

  </div>

  <div class="ov" id="ovAsk" style="z-index:7">

      <div class="sub" id="askMsg" style="color:#f4f4f4;font-size:calc(var(--u)*6);text-align:center"></div>
      <div class="row"><button class="btn" id="askYes" style="min-width:0;flex:1;background:#b13e53">예</button><button class="btn gray" id="askNo" style="min-width:0;flex:1">아니오</button></div>
    </div>
  </div>

  <div class="ov" id="ovSet">
    <div class="hd">설정</div>
    <div class="build" style="font-size:calc(var(--u)*6)">
      <div style="align-items:center"><span style="width:auto;flex:1;color:#f4f4f4">🔊 소리</span><button class="btn sm" id="bSnd1" style="min-width:calc(var(--u)*34)">켜짐</button></div>
      <div style="align-items:center"><span style="width:auto;flex:1;color:#f4f4f4">📳 진동</span><button class="btn sm" id="bVib" style="min-width:calc(var(--u)*34)">켜짐</button></div>
      <div style="align-items:center"><span style="width:auto;flex:1;color:#f4f4f4">🖥 화면</span><button class="btn sm" id="bCrisp" style="min-width:calc(var(--u)*34)">꽉 채우기</button></div>
    </div>
    <button class="btn sm" id="bInstall" style="background:#38b764">📲 홈 화면에 바로가기 추가</button>
    <button class="btn sm" id="bWipe" style="background:#b13e53">⚠ 전체 초기화</button>
    <button class="btn gray" id="bSetBack">돌아가기</button>
  </div>

  <div class="ov" id="ovCard">
    <div class="hd" id="cHd">LEVEL UP!</div>
    <div class="sub" id="cSub">능력 하나를 선택하세요</div>
    <div id="cards"></div>
    <button class="btn sm gray" id="bReroll">다시 뽑기</button>
  </div>

  <div class="ov" id="ovPause">
    <div class="hd">일시정지</div>
    <div class="sec">능력치</div>
    <div class="stat3" id="pStats"></div>
    <div class="sec">이번 사냥</div>
    <div class="build" id="pBuild"></div>
    <button class="btn gold" id="bResume">▶ 계속하기</button>
    <button class="btn" id="bRebirth" style="display:none;background:#9d5ad6">★ 환생하기 (영혼 ×2)</button>
    <div class="row"><button class="btn sm" id="bSet2">⚙ 설정</button><button class="btn sm gray" id="bGiveup">사냥 포기</button></div>
  </div>

  <div class="ov" id="ovOver">
    <div class="hd" id="oHd">사냥 종료</div>
    <div class="stats" id="oStats"></div>
    <div class="big">획득 영혼 <span class="soul" id="oSoul">0</span></div>
    <button class="btn gold" id="bRetry">다시 도전</button>
    <button class="btn" id="bShop2">영혼 강화</button>
    <button class="btn sm gray" id="bHome">타이틀로</button>
  </div>

  <div class="ov" id="ovEquip">
    <div class="hd">장비</div>
    <div class="sub">몬스터·보스가 떨어뜨린 장비 중 더 좋은 것을 자동 장착합니다<br>약한 장비는 영혼으로 바뀝니다</div>
    <div class="shoplist" id="equipList"></div>
    <button class="btn" id="bEquipBack">돌아가기</button>
  </div>

  <div class="ov" id="ovPet">
    <div class="hd">펫</div>
    <div class="sub">보스·정예가 떨어뜨리는 알에서 부화 · 최대 3마리 동행<br>사냥하면 경험치가 쌓여 레벨업 · 50레벨마다 별 진화 (최대 Lv250 ★5)</div>
    <div class="shoplist" id="petList"></div>
    <button class="btn" id="bPetBack">돌아가기</button>
  </div>

  <div class="ov" id="ovShop">
    <div class="hd">영혼 강화</div>
    <div class="sub">보유 영혼 <span class="soul big" id="sSoul">0</span></div>
    <div id="shopTier" style="width:100%"></div>
    <div class="shoplist" id="shopList"></div>
    <button class="btn" id="bShopBack">돌아가기</button>
  </div>
</div>

let AC=null,master=null,muted=false;const lastS={};let NB=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.4;master.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;BGM.next=AC.currentTime+.1}catch(e){AC=null}}
function tone(f,dur,type='square',vol=.1,slide=0,delay=0,at){if(!AC)return;const t=(at||AC.currentTime)+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.1,freq=1500,delay=0,type='bandpass',at){if(!AC)return;const t=(at||AC.currentTime)+delay;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}

function sfx(n,gap=.045){if(!AC||muted)return;const t=AC.currentTime;if(lastS[n]&&t-lastS[n]<gap)return;lastS[n]=t;try{SFX[n]()}catch(e){}}
const BGM={step:0,next:0};
function bgmTick(){if(!AC||muted||AC.state!=='running')return;const playing=state==='play'||state==='title';if(!playing){BGM.next=AC.currentTime+.05;return}
 const boss=state==='play'&&G&&isBoss(G.stage);const spb=60/(boss?152:126)/4;if(BGM.next<AC.currentTime-.2)BGM.next=AC.currentTime+.05;
 while(BGM.next<AC.currentTime+.15){const s=BGM.step%16,bar=Math.floor(BGM.step/16)%4,t=BGM.next;const base=(G?BIOMES[biomeOf(G.stage)].tone:0)+[0,-4,-2,-5][bar];
  const fq=n=>110*Math.pow(2,(n+base)/12);
  if(s%4===0){tone(150,.12,'sine',.12,-110,0,t)}
  if([0,3,6,8,11,14].includes(s))tone(fq(-12),.14,'triangle',.11,0,0,t);
  tone(fq([12,15,19,24,19,15][s%6]+(boss&&s%8>3?1:0)),.07,'square',.018,0,0,t);
  if(s%2===1)noise(.03,.025,7000,0,'highpass',t);
  if(s===4||s===12)noise(.09,.05,1800,0,'bandpass',t);
  BGM.next+=spb;BGM.step++}}
setInterval(bgmTick,30);

let toastT=null;function toast(s){const el=$('toast');el.textContent=s;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1600)}
function burst(x,y,cols,n,spd=60,g=180){for(let i=0;i<n;i++){if(G.parts.length>450)G.parts.shift();G.parts.push({x,y,vx:rnd(-1,1)*spd,vy:rnd(-1.3,.2)*spd,life:rnd(.3,.75),c:pick(cols),s:Math.random()<.3?2:1,g})}}
function heal(v,silent){const h=G.h;if(h.dead)return;const b=h.hp;h.hp=Math.min(G.st.maxHp,h.hp+v);if(!silent&&h.hp-b>=1)addText('+'+fmt(h.hp-b),h.x,GY-26,'heal')}

function dmgEnemy(e,base,o={}){if(e.dead)return 0;const SK=o.sk===undefined?CUR_SK:o.sk;let d0;let crit=o.noCrit?false:(o.crit!==undefined?o.crit:Math.random()<G.st.crit);
 let d=base*rnd(.9,1.1);if(crit)d*=G.st.critDmg;if(G.mods.giant&&(e.boss||e.elite))d*=2;if(e.freezeT>0)d*=1.5;if(G.buffT>0)d*=G.buffM||1.3;if(hasR('mask')&&G.h.hp<G.st.maxHp*.5)d*=1.4;if(e.boss&&inParty('ghost'))d*=1+.1*petPow('ghost');d=Math.max(1,Math.round(d));
 e.hp-=d;e.flash=.08;if(G.fx.length<70)G.fx.push({k:'spark',x:e.x-e.hw*.4+rnd(-2,2),y:ecy(e)+rnd(-3,3),life:crit?.16:.1,max:crit?.16:.1,c:crit?'#ffcd75':'#f4f4f4',r:crit?7:4});if(o.kb)e.kv=o.kb*(e.boss?.15:1);
 addText(fmt(d),e.x,etop(e)-4,crit?'crit':(o.col||'norm'));
 if(o.melee&&G.st.ls>0)heal(d*G.st.ls,true);
 if(SK&&!o.noChain){const E=Math.min(5,evS(SK));
  if(E>=2&&Math.random()<.35){let nb=null,bd=55;for(const o2 of G.enemies){if(o2===e||o2.dead)continue;const dd=Math.abs(o2.x-e.x);if(dd<bd){bd=dd;nb=o2}}if(nb){G.fx.push({k:'line',x0:e.x,y0:ecy(e),x1:nb.x,y1:ecy(nb),c:stc(evS(SK)),glow:true,life:.12,max:.12});dmgEnemy(nb,d*.4,{noCrit:true,noChain:true,sk:null,col:o.col})}}
  if(E>=3&&!e.dead)applyStatus(e,SK.id,d)}
 if(e.hp<=0){killEnemy(e);if(SK&&evS(SK)>=4&&SK.t>0&&Math.random()<.25){SK.t=0;addText('RESET',G.h.x,GY-30,'bolt')}}return d}
const STATUS={fire:'burn',meteor:'burn',holy:'burn',bolt:'stun',quake:'stun',frost:'slow',tornado:'slow',poison:'poison',sdag:'poison',hole:'poison',blade:'bleed',guard:'bleed'};

function applyStatus(e,id,d){const st=STATUS[id];if(!st)return;if(st==='stun')e.stunT=Math.max(e.stunT||0,.4);else if(st==='slow')e.slowT=Math.max(e.slowT,2);else e.dot={k:st,dps:Math.max(1,d*.18),t:3,tick:.5}}

 const gold=e.gold*G.st.gold;G.gold+=gold;G.runGold+=gold;gainXp(e.xp*G.st.xp);
 const cy=ecy(e),sp=eSpr(e.type,0,e.boss);const bi=BIOMES[biomeOf(G.stage)];
 burst(e.x,cy,[...sp.cols,'#f4f4f4',bi.amb],e.boss?70:16,e.boss?120:65);for(let i=0;i<(e.boss?14:4);i++)G.parts.push({x:e.x+rnd(-4,4),y:cy+rnd(-3,3),vx:rnd(-8,8),vy:rnd(-25,-10),life:rnd(.4,.8),c:pick(['#94b0c2','#566c86']),s:2,g:-10});
 G.fx.push({k:'ring',x:e.x,y:cy,r0:2,r1:e.boss?40:10,life:.25,max:.25,col:'#f4f4f4',sy:1});
 if(hasR('fang'))heal(G.st.maxHp*.02,true);
 if(hasR('bomb')&&!e.boss){G.fx.push({k:'ring',x:e.x,y:cy,r0:2,r1:16,life:.2,max:.2,col:'#ef7d57',sy:.7});for(const o of G.enemies)if(!o.dead&&o!==e&&Math.abs(o.x-e.x)<18)dmgEnemy(o,G.st.atk*.8,{col:'fire',noCrit:true})}
 for(const id of SAVE.party)petGainXp(id,(1+Math.floor(G.stage/10))*(e.boss?20:e.elite?3:1));
 {const pb=inParty('slime')?1+.25*petPow('slime'):1;const ec=(e.boss?(Object.keys(SAVE.pets).length?.3:1):e.elite?.03:0)*pb;if(Math.random()<ec)G.drops.push({x:e.x+6,y:cy,vy:-90,t:0,egg:true})}
 {const ch=(e.boss?1:e.elite?.3:.03)*(hasR('lucky')?2:1)*(inParty('slime')?1+.25*petPow('slime'):1);if(Math.random()<ch)G.drops.push({x:e.x,y:cy,vy:-80,t:0,it:makeItem(rollIRar(e.boss),G.stage)})}
 if(e.boss){const rs=Object.keys(RELICS).filter(r=>!G.relics.includes(r));if(rs.length){const r=pick(rs);G.relics.push(r);recalc();setTimeout(()=>toast('유물 획득: '+RELICS[r].n+' — '+RELICS[r].d),900)}}
 G.corpses.push({s:eSpr(e.type,0,e.boss),x:e.x,y:e.fly?ecy(e)+e.h/2:GY,w:e.w,h:e.h,t:0,fly:e.fly,sc:e.sc});
 const nc=Math.min(8,1+(e.elite?3:0)+(e.boss?7:0));for(let i=0;i<nc;i++)G.coins.push({x:e.x,y:cy,vx:rnd(-40,40),vy:rnd(-90,-40),t:rnd(-.1,0)});
 if(e.elite||e.boss)addText('+'+fmt(gold)+'G',e.x,cy-14,'gold');

 if(big)G.fx.push({k:'ring',x,y,r0:1,r1:r*.6,life:.3,max:.3,col:'#f4f4f4',sy:.6});
 burst(x,y,['#ffcd75','#ef7d57','#b13e53','#1a1c2c'],big?50:14,big?130:70);for(let i=0;i<(big?18:5);i++)G.parts.push({x:x+rnd(-r*.5,r*.5),y:y+rnd(-4,2),vx:rnd(-10,10),vy:rnd(-30,-10),life:rnd(.5,1),c:pick(['#566c86','#333c57','#94b0c2']),s:2,g:-8});if(big)G.fx.push({k:'flash',x,y,life:.12,max:.12,r});
 G.shake=Math.max(G.shake,big?7:1.5);if(big){G.hitstop=.05;sfx('boom');vib(40)}else sfx('fire')}
function doAttack(){const h=G.h,f=front();if(!f||f.x-f.hw-h.x>18)return;h.atkAnim=.15;const crit=Math.random()<G.st.crit;const BV=G.basicEvo||0,BM=(1+.15*Math.min(5,BV))*(BV>=6?1.5:1);
 if((SAVE.job||{}).b==='ranger')G.fx.push({k:'line',x0:h.x+10,y0:GY-11,x1:f.x,y1:ecy(f),c:'#f4f4f4',life:.08,max:.08});else G.fx.push({k:'slash',life:.14,max:.14,crit,flip:h.flipS=!h.flipS});
 const tg=(G.mods.cleave||BV>=3)?G.enemies.filter(e=>!e.dead&&e.x-e.hw-h.x<=(BV>=1?34:28)):[f];for(const e of tg)dmgEnemy(e,G.st.atk*BM,{crit,melee:true,kb:45});
 if(BV>=2&&!f.dead&&Math.random()<.3)dmgEnemy(f,G.st.atk*BM*.7,{melee:true});
 if(BV>=6){G.proj.push({k:'wave',x:h.x+10,y:GY-9,hit:[],dmg:G.st.atk*BM})}else if(BV>=5){h.bwc=(h.bwc||0)+1;if(h.bwc>=5){h.bwc=0;for(const e of G.enemies)if(!e.dead&&e.x<W)dmgEnemy(e,G.st.atk*BM*2,{col:'gold'});G.flashScr=.12;G.fx.push({k:'beam',x:W/2,life:.12,max:.12})}}
 if(hasR('ring')&&Math.random()<.2&&!f.dead){dmgEnemy(f,G.st.atk*1.5,{col:'bolt'});G.fx.push({k:'bolt',segs:[[f.x+rnd(-3,3),0,f.x,ecy(f)]],life:.15,max:.15});sfx('zap')}
 if(G.mods.shadow&&!f.dead){h.shT=.15;dmgEnemy(f,G.st.atk*.6,{col:'thorn'})}

 sfx(crit?'crit':'hit');if(crit){G.shake=Math.max(G.shake,2);G.hitstop=Math.max(G.hitstop,.03)}}
function petHit(t,dmg,PS,st,o){dmgEnemy(t,dmg,Object.assign({sk:null},o));if(PS>=3){let nb=null,bd=45;for(const e of G.enemies){if(e===t||e.dead)continue;const d=Math.abs(e.x-t.x);if(d<bd){bd=d;nb=e}}if(nb){dmgEnemy(nb,dmg*.5,{sk:null,noCrit:true});G.fx.push({k:'line',x0:t.x,y0:ecy(t),x1:nb.x,y1:ecy(nb),c:stc(PS),glow:true,life:.1,max:.1})}}if(PS>=4&&!t.dead){if(st==='slow')t.slowT=Math.max(t.slowT,2.5);else t.dot={k:st,dps:Math.max(1,dmg*.2),t:3,tick:.5}}}

function targets(){return G.enemies.filter(e=>!e.dead&&e.x<W-4).sort((a,b)=>a.x-b.x)}
let CUR_SK=null;

function castInner(sk){const tg=targets();if(!tg.length)return false;const A=G.st.atk*G.st.sk,l=sk.lv,h=G.h;
 const UL=isUlt(sk),EV=Math.min(5,evS(sk)),FN=EV>=5,EM=(1+.2*EV)*(UL?2:1);
 if(sk.id==='fire'){const n=EV?2+Math.ceil(EV/2):l>=3?2:1;for(let i=0;i<n;i++){const t=i?pick(tg):tg[0];G.proj.push({k:'fire',ev:evS(sk),x:h.x+6,y:GY-12-i*3,tg:t,tx:t.x,ty:ecy(t),dmg:A*(1.4+.45*l)*EM,r:(12+2*l)*(1+.1*EV),burn:UL?A*.8:0,chain:FN?A*(1.4+.45*l)*EM*.5:0})}sfx('fire')}
 else if(sk.id==='bolt'){const n=Math.round((2+l)*(1+.3*EV));let pts=[{x:h.x+4,y:GY-14}],hit=[];let cur=tg[0];

function genCards(){const L=SAVE.meta.luck;const wts=[Math.max(20,60-L*5),28+L*2,10+L*2,2+L];
 const roll=()=>{let s=wts.reduce((a,b)=>a+b),r=Math.random()*s;for(let i=0;i<4;i++)if((r-=wts[i])<0)return i;return 0};
 const out=[];let g=0;while(out.length<3&&g++<80){const r=roll();let pool=[];
  if(r<=2)STATC.forEach(c=>pool.push({kind:'stat',c,r,key:'s'+c.id}));
  SPECC.forEach(c=>{if(c.r===r&&!G.owned.has(c.id))pool.push({kind:'spec',c,r,key:'p'+c.id})});
  if(r===1&&G.skills.length<4)Object.keys(SKILLS).forEach(id=>{if(!G.skills.find(s=>s.id===id))for(let k=0;k<3;k++)pool.push({kind:'skill',id,r,isNew:true,key:'k'+id})});
  if(r>=1)G.skills.forEach(s=>{if(s.lv>=5&&evS(s)<5)for(let k=0;k<4;k++)pool.push({kind:'skill',id:s.id,r:evS(s)>=4?3:2,evo:true,key:'e'+s.id})});
  if(r===3)G.skills.forEach(s=>{if(evS(s)===5)for(let k=0;k<5;k++)pool.push({kind:'skill',id:s.id,r:3,evo:true,ult:true,key:'u'+s.id})});
  {const bv=G.basicEvo||0,br=bv<4?1:bv<5?2:3;if(bv<6&&r===br)for(let k=0;k<3;k++)pool.push({kind:'basic',r:br,key:'basic'})}
  if(r<=1)G.skills.forEach(s=>{if(s.lv<5)for(let k=0;k<3;k++)pool.push({kind:'skill',id:s.id,r,up:Math.min(r===0?1:2,5-s.lv),key:'k'+s.id})});
  pool=pool.filter(p=>!out.some(o=>o.key===p.key));if(pool.length)out.push(pick(pool))}
 if(!G.skills.length&&!out.some(o=>o.isNew)){const ids=Object.keys(SKILLS);const pickId=pick(ids.filter(id=>!out.some(o=>o.key==='k'+id)));out[0]={kind:'skill',id:pickId,r:1,isNew:true,key:'k'+pickId}}

  const b=document.createElement('button');const can=ok&&lv<n.max&&spFree()>0;b.className='btn sm '+(can?'gold':'gray');b.textContent=lv>=n.max?'MAX':'+1';b.disabled=!can;
  b.onclick=()=>{if(!(ok&&tLv(n.id)<n.max&&spFree()>0))return;SAVE.tree[n.id]=tLv(n.id)+1;save();sfx('buy');if(G&&G.st)recalc();const sc=L.scrollTop;openTree();$('treeList').scrollTop=sc};r.appendChild(b);L.appendChild(r)}
 show('ovTree')}
if($('bTree1'))$('bTree1').onclick=()=>{initAudio();sfx('click');openTree('title')};
if($('bTree2'))$('bTree2').onclick=()=>{sfx('click');openTree('pause')};
$('bTreeBack').onclick=()=>{sfx('click');if(treeFrom==='pause'){openPause2()}else goTitle()};
$('bTreeReset').onclick=()=>{SAVE.tree={};save();sfx('click');if(G&&G.st)recalc();openTree();toast('스킬 포인트를 모두 돌려받았어요')};
function openPause2(){state='play';openPause()}
$('bSet1').onclick=()=>{initAudio();sfx('click');setFrom='title';setMute(muted);crispLbl();vibLbl();show('ovSet')};function ask(msg,yes,back){$('askMsg').innerHTML=msg;show('ovAsk');$('askYes').onclick=()=>{sfx('click');yes()};$('askNo').onclick=()=>{sfx('click');show(back)}}
$('bWipe').onclick=()=>{sfx('click');ask('모든 기록을 지우고 <b style="color:#ffcd75">Lv1부터 다시 시작</b>할까요?<br><br><span style="color:#94b0c2;font-size:.85em">레벨·전직·환생·영혼·장비·펫·최고 기록이 모두 지워지며<br>되돌릴 수 없습니다</span>',()=>{
 const keep={mute:SAVE.mute,noVib:SAVE.noVib,crisp:SAVE.crisp};try{localStorage.removeItem('pxhunter_v1');localStorage.removeItem(RUNKEY)}catch(e){}
 SAVE=Object.assign(SAVE0(),keep);save();goTitle();toast('모든 기록을 초기화했어요. Lv1부터 다시 시작합니다')},'ovSet')};
let setFrom='title';$('bSetBack').onclick=()=>{sfx('click');if(setFrom==='pause'){show('ovPause')}else goTitle()};
$('bSet2').onclick=()=>{sfx('click');setFrom='pause';crispLbl();vibLbl();setMute(muted);show('ovSet')};
$('bPet1').onclick=()=>{initAudio();sfx('click');openPet()};$('bPetBack').onclick=()=>{sfx('click');goTitle()};
function openEquip(){const L=$('equipList');L.innerHTML='';for(const k of Object.keys(ISLOT)){const S=ISLOT[k],it=SAVE.eq[k];const r=document.createElement('div');r.className='srow';
 r.innerHTML=it?`<img src="${iconURL(S.icon)}" style="border:var(--u) solid ${IRAR[it.rar].c}"><div><div class="nm" style="color:${IRAR[it.rar].c}">${it.name}<span>${S.n} · ${IRAR[it.rar].n}</span></div><div class="ds">${[it.main,...it.opts].map(iLine).join('<br>')}</div></div>`
  :`<img src="${iconURL(S.icon)}" style="opacity:.3"><div><div class="nm">${S.n}<span>비어 있음</span></div><div class="ds">몬스터를 사냥해 장비를 얻으세요</div></div>`;L.appendChild(r)}show('ovEquip')}
$('bEquip1').onclick=()=>{initAudio();sfx('click');openEquip()};$('bEquipBack').onclick=()=>{sfx('click');goTitle()};
$('bShop1').onclick=()=>{initAudio();sfx('click');openShop('ovTitle')};$('bShop2').onclick=()=>{sfx('click');openShop('ovOver')};
$('bShopBack').onclick=()=>{sfx('click');if(shopBack==='ovTitle')goTitle();else show('ovOver')};
$('bHome').onclick=()=>{sfx('click');goTitle()};
$('bResume').onclick=()=>{sfx('click');show(null);state='play'};
$('bRebirth').onclick=()=>{show(null);state='play';sfx('lvl');endRun(true)};
$('bGiveup').onclick=()=>{show(null);state='play';G.h.dead=true;G.deadT=1.8;endRun()};
$('bReroll').onclick=()=>{if(G.rerolls>0){G.rerolls--;sfx('click');curCards=genCards();renderCards()}};
$('bSnd1').onclick=()=>{initAudio();setMute(!muted)};
cvs.addEventListener('pointerdown',ev=>{initAudio();if(state!=='play')return;const r=cvs.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
 for(const b of BTN)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.act();return}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')openPause()});
addEventListener('keydown',e=>{if(state==='play'){if(e.key==='1')buyUp(UPG[0]);if(e.key==='2')buyUp(UPG[1]);if(e.key==='3')buyUp(UPG[2]);if(e.key==='a'||e.key==='A')manualAtk();if(['q','w','e','r'].includes(e.key))useSkill(['q','w','e','r'].indexOf(e.key));if(e.key==='Escape')openPause()}
 else if(state==='levelup'&&['1','2','3'].includes(e.key)&&curCards[+e.key-1])chooseCard(curCards[+e.key-1])});

function resize(){const vw=innerWidth,vh=innerHeight,dpr=window.devicePixelRatio||1;let s,NS;
 if(SAVE.crisp){const k=Math.floor(Math.min(vw*dpr/W,vh*dpr/H));NS=Math.max(2,k);s=k>=2?k/dpr:Math.min(vw/W,vh/H)}
 else{s=Math.min(vw/W,vh/H);NS=Math.max(2,s*dpr)}
 if(NS!==SCL||cvs.width!==Math.round(W*NS)){SCL=NS;cvs.width=Math.round(W*SCL);cvs.height=Math.round(H*SCL)}
 wrap.style.width=(W*s)+'px';wrap.style.height=(H*s)+'px';wrap.style.transform='none';wrap.style.left=Math.round((vw-W*s)/2*dpr)/dpr+'px';wrap.style.top=Math.max(0,Math.round((vh-H*s)/2*dpr)/dpr)+'px';document.documentElement.style.setProperty('--u',s+'px')}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 try{if(state==='play'){if(G.hitstop>0)G.hitstop-=dt;else for(let i=0;i<G.speed;i++)update(dt);
   if(G.lvDelay<=0&&!G.h.dead&&state==='play'){if(SAVE.job.t<3&&SAVE.lv>=JOBLV[SAVE.job.t])openJob();else if(G.pendingLv>0)openCards()}}
  else if(state==='title'){G.scroll+=WALK*dt;G.h.anim+=dt;G.time+=dt;G.walking=true;updParts(dt)}
  render()}catch(err){console.error(err)}
 requestAnimationFrame(frame)}
setInterval(saveRun,3000);addEventListener('pagehide',saveRun);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
let installEvt=null;const standalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
function updInstall(){$('bInstall').style.display=standalone()?'none':''}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;updInstall()});
addEventListener('appinstalled',()=>{installEvt=null;toast('홈 화면에 추가됐어요! 이제 아이콘으로 실행하세요');updInstall()});
$('bInstall').onclick=async()=>{sfx('click');if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null}
 else toast(/iPad|iPhone/.test(navigator.userAgent)?'공유(□↑) → 홈 화면에 추가':'브라우저 메뉴(⋮) → 홈 화면에 추가')};
updInstall();
load();resize();muted=!!SAVE.mute;setMute(muted);goTitle();requestAnimationFrame(frame);
window.__dbg={get G(){return G},get state(){return state},startRun,chooseCard:i=>chooseCard(curCards[i])};
</script>
