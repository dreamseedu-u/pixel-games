<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>PIXEL HUNTER - 로그라이트 자동사냥</title>
<style>
:root{--u:2px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#0b0c14;overflow:hidden;touch-action:none;color:#f4f4f4;
font-family:"Galmuri11","DungGeunMo","NeoDunggeunmo","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#1a1c2c;box-shadow:0 0 60px #000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);
padding:calc(var(--u)*8);background:rgba(10,11,20,.84);z-index:5;text-align:center}
.ov.show{display:flex;animation:fade .2s}
.ov.clear{background:transparent;justify-content:flex-end;padding-bottom:calc(var(--u)*22)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hd{font-size:calc(var(--u)*11);font-weight:900;color:#ffcd75;letter-spacing:calc(var(--u)*.4);
text-shadow:0 var(--u) 0 #b13e53,0 calc(var(--u)*2) 0 #1a1c2c,var(--u) 0 0 #1a1c2c,calc(var(--u)*-1) 0 0 #1a1c2c}
.sub{font-size:calc(var(--u)*5.5);color:#94b0c2;line-height:1.5}
.btn{font:inherit;font-weight:800;font-size:calc(var(--u)*7);color:#f4f4f4;background:#3b5dc9;border:none;cursor:pointer;
padding:calc(var(--u)*4) calc(var(--u)*8);min-width:62%;
box-shadow:inset 0 calc(var(--u)*-2) 0 #29366f,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #f4f4f4}
.btn:active{transform:translateY(var(--u));box-shadow:inset 0 calc(var(--u)*-1) 0 #29366f,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #f4f4f4}
.btn.gold{background:#ef7d57;box-shadow:inset 0 calc(var(--u)*-2) 0 #b13e53,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #ffcd75}
.btn.gray{background:#566c86;box-shadow:inset 0 calc(var(--u)*-2) 0 #333c57,0 0 0 var(--u) #1a1c2c,0 0 0 calc(var(--u)*2) #94b0c2}
.btn.sm{font-size:calc(var(--u)*5.5);padding:calc(var(--u)*2.5) calc(var(--u)*5);min-width:0}
.btn[disabled]{opacity:.4}
#cards{display:flex;flex-direction:column;gap:calc(var(--u)*5);width:100%}
.card{--rc:#94b0c2;display:flex;align-items:center;gap:calc(var(--u)*5);background:#232843;padding:calc(var(--u)*5);text-align:left;cursor:pointer;
border:calc(var(--u)*1.5) solid var(--rc);box-shadow:0 0 0 var(--u) #1a1c2c,inset 0 calc(var(--u)*-2) 0 #1a1c2c;animation:pop .35s both}
.card:active{transform:scale(.97)}
.card img{width:calc(var(--u)*24);height:calc(var(--u)*24);image-rendering:pixelated;flex:none;background:#1a1c2c;padding:calc(var(--u)*3);border:var(--u) solid var(--rc)}
.card .rr{font-size:calc(var(--u)*4.5);color:var(--rc);font-weight:800}
.card .nm{font-size:calc(var(--u)*7);font-weight:800;margin-top:calc(var(--u)*.5)}
.card .ds{font-size:calc(var(--u)*5.2);color:#c8d3e0;margin-top:var(--u);line-height:1.35}
.card.r3{animation:pop .35s both,glow .8s .35s infinite alternate}
.card.r2{background:#2a2346}
@keyframes pop{from{transform:scale(.6) translateY(calc(var(--u)*10));opacity:0}to{transform:none;opacity:1}}
@keyframes glow{to{box-shadow:0 0 calc(var(--u)*9) #ffcd75,0 0 0 var(--u) #1a1c2c}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2) calc(var(--u)*6);font-size:calc(var(--u)*5.5);width:100%;
background:#232843;padding:calc(var(--u)*5);text-align:left;box-shadow:0 0 0 var(--u) #566c86}
.stats b{color:#ffcd75;float:right}
.shoplist{width:100%;max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:calc(var(--u)*3);touch-action:pan-y}
.srow{display:flex;align-items:center;gap:calc(var(--u)*4);background:#232843;padding:calc(var(--u)*3) calc(var(--u)*4);text-align:left;box-shadow:0 0 0 var(--u) #566c86}
.srow img{width:calc(var(--u)*16);height:calc(var(--u)*16);image-rendering:pixelated;flex:none}
.srow .nm{font-size:calc(var(--u)*6);font-weight:800}
.srow .nm span{color:#73eff7;font-size:calc(var(--u)*4.5);margin-left:calc(var(--u)*2)}
.srow .ds{font-size:calc(var(--u)*4.8);color:#94b0c2}
.srow .btn{margin-left:auto;white-space:nowrap}
.soul{color:#73eff7;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4);width:100%}
.tile{font:inherit;color:#f4f4f4;background:#232843;border:none;cursor:pointer;display:flex;align-items:center;gap:calc(var(--u)*3);
padding:calc(var(--u)*3.5) calc(var(--u)*4);box-shadow:inset 0 calc(var(--u)*-2) 0 #1a1c2c,0 0 0 var(--u) #566c86;text-align:left}
.tile:active{transform:translateY(var(--u))}
.tile img{width:calc(var(--u)*13);height:calc(var(--u)*13);image-rendering:pixelated;flex:none}
.tile b{display:block;font-size:calc(var(--u)*6.2)}.tile small{display:block;font-size:calc(var(--u)*4.4);color:#94b0c2}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*2)}
.chip{font-size:calc(var(--u)*4.8);padding:var(--u) calc(var(--u)*3);background:rgba(26,28,44,.85);box-shadow:0 0 0 var(--u) #333c57;white-space:nowrap}
.chip b{color:#ffcd75}
.sec{width:100%;text-align:left;font-size:calc(var(--u)*4.6);color:#94b0c2;margin-bottom:calc(var(--u)*-2)}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:calc(var(--u)*2);width:100%}
.stat3 div{background:#232843;padding:calc(var(--u)*2) calc(var(--u)*2.5);font-size:calc(var(--u)*4.4);color:#94b0c2;box-shadow:0 0 0 var(--u) #333c57}
.stat3 b{display:block;font-size:calc(var(--u)*6);color:#f4f4f4}
.build{width:100%;background:#232843;box-shadow:0 0 0 var(--u) #333c57;font-size:calc(var(--u)*4.8);text-align:left}
.build div{display:flex;gap:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*3);border-bottom:var(--u) solid #1a1c2c}
.build div:last-child{border-bottom:none}
.build span{flex:none;width:calc(var(--u)*17);color:#94b0c2}
.build em{font-style:normal;line-height:1.35}
#toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:6;pointer-events:none;font-weight:800;

.row{display:flex;gap:calc(var(--u)*4);justify-content:center;width:100%}
.big{font-size:calc(var(--u)*8);font-weight:900}

</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="toast"></div>

  <div class="ov clear" id="ovTitle" style="padding-bottom:calc(var(--u)*12)">
    <div class="chips" id="titleInfo"></div>
    <button class="btn gold" id="bCont" style="display:none">▶ 이어하기</button>
    <button class="btn gold" id="bStart">▶ 사냥 시작</button>
    <div class="tiles">
      <button class="tile" id="bShop1"><img data-ic="coin2"><span><b>영혼 강화</b><small>영구 능력 강화</small></span></button>
      <button class="tile" id="bEquip1"><img data-ic="sword"><span><b>장비</b><small>무기·갑옷·방패·장신구</small></span></button>
      <button class="tile" id="bPet1"><img data-pet="dragon"><span><b>펫</b><small>동행·진화</small></span></button>
      <button class="tile" id="bSet1"><img data-ic="gem"><span><b>설정</b><small>소리·바로가기</small></span></button>
    </div>
  </div>

  <div class="ov" id="ovSet">
    <div class="hd">설정</div>
    <button class="btn" id="bSnd1">소리: 켜짐</button>
    <button class="btn" id="bInstall" style="background:#38b764">📲 홈 화면에 바로가기 추가</button>
    <div class="sub">바로가기를 추가하면 아이콘만 눌러 실행되고<br>인터넷이 없어도 플레이할 수 있어요</div>
    <button class="btn gray" id="bSetBack">돌아가기</button>
  </div>

  <div class="ov" id="ovCard">
    <div class="hd" id="cHd">LEVEL UP!</div>
    <div class="sub" id="cSub">능력 하나를 선택하세요</div>
    <div id="cards"></div>
    <button class="btn sm gray" id="bReroll">다시 뽑기</button>
  </div>

  <div class="ov" id="ovPause">
    <div class="hd">일시정지</div>
    <div class="sec">능력치</div>
    <div class="stat3" id="pStats"></div>
    <div class="sec">이번 사냥</div>
    <div class="build" id="pBuild"></div>
    <button class="btn gold" id="bResume">▶ 계속하기</button>
    <button class="btn" id="bRebirth" style="display:none;background:#9d5ad6">★ 환생하기 (영혼 ×2)</button>
    <div class="row"><button class="btn sm gray" id="bSnd2">소리</button><button class="btn sm gray" id="bGiveup">사냥 포기</button></div>
  </div>

  <div class="ov" id="ovOver">
    <div class="hd" id="oHd">사냥 종료</div>
    <div class="stats" id="oStats"></div>
    <div class="big">획득 영혼 <span class="soul" id="oSoul">0</span></div>
    <button class="btn gold" id="bRetry">다시 도전</button>
    <button class="btn" id="bShop2">영혼 강화</button>
    <button class="btn sm gray" id="bHome">타이틀로</button>
  </div>

  <div class="ov" id="ovEquip">
    <div class="hd">장비</div>
    <div class="sub">몬스터·보스가 떨어뜨린 장비 중 더 좋은 것을 자동 장착합니다<br>약한 장비는 영혼으로 바뀝니다</div>
    <div class="shoplist" id="equipList"></div>
    <button class="btn" id="bEquipBack">돌아가기</button>
  </div>

  <div class="ov" id="ovPet">
    <div class="hd">펫</div>
    <div class="sub">보스·정예가 떨어뜨리는 알에서 부화 · 최대 3마리 동행<br>사냥하면 경험치가 쌓여 레벨업 · 50레벨마다 별 진화 (최대 Lv250 ★5)</div>
    <div class="shoplist" id="petList"></div>
    <button class="btn" id="bPetBack">돌아가기</button>
  </div>

  <div class="ov" id="ovShop">
    <div class="hd">영혼 강화</div>
    <div class="sub">보유 영혼 <span class="soul big" id="sSoul">0</span></div>
    <div id="shopTier" style="width:100%"></div>
    <div class="shoplist" id="shopList"></div>
    <button class="btn" id="bShopBack">돌아가기</button>
  </div>
</div>

function mkSpr(rows,swap,shade){const h=rows.length,w=rows[0].length,c=cv(w,h),g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let ch=rows[y][x];if(!ch||ch==='.')continue;ch=(swap&&swap[ch])||ch;if(!PAL[ch])continue;g.fillStyle=PAL[ch];g.fillRect(x,y,1,1)}
  if(shade){const im=g.getImageData(0,0,w,h),d=im.data,src=new Uint8ClampedArray(d),O=hex(PAL.k);
   const isO=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return true;const o=(y*w+x)*4;return src[o+3]===0||(src[o]===O[0]&&src[o+1]===O[1]&&src[o+2]===O[2])};
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(isO(x,y))continue;const o=(y*w+x)*4;
    if(isO(x,y-1)){for(let k=0;k<3;k++)d[o+k]=Math.min(255,d[o+k]+34)}else if(isO(x,y+1)||isO(x+1,y)){for(let k=0;k<3;k++)d[o+k]=d[o+k]*.74}}
   g.putImageData(im,0,0)}
  return c}

function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.4;master.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;BGM.next=AC.currentTime+.1}catch(e){AC=null}}
function tone(f,dur,type='square',vol=.1,slide=0,delay=0,at){if(!AC)return;const t=(at||AC.currentTime)+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol=.1,freq=1500,delay=0,type='bandpass',at){if(!AC)return;const t=(at||AC.currentTime)+delay;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}

function bgmTick(){if(!AC||muted||AC.state!=='running')return;const playing=state==='play'||state==='title';if(!playing){BGM.next=AC.currentTime+.05;return}
 const boss=state==='play'&&G&&isBoss(G.stage);const spb=60/(boss?152:126)/4;if(BGM.next<AC.currentTime-.2)BGM.next=AC.currentTime+.05;
 while(BGM.next<AC.currentTime+.15){const s=BGM.step%16,bar=Math.floor(BGM.step/16)%4,t=BGM.next;const base=(G?BIOMES[biomeOf(G.stage)].tone:0)+[0,-4,-2,-5][bar];
  const fq=n=>110*Math.pow(2,(n+base)/12);
  if(s%4===0){tone(150,.12,'sine',.12,-110,0,t)}
  if([0,3,6,8,11,14].includes(s))tone(fq(-12),.14,'triangle',.11,0,0,t);
  tone(fq([12,15,19,24,19,15][s%6]+(boss&&s%8>3?1:0)),.07,'square',.018,0,0,t);
  if(s%2===1)noise(.03,.025,7000,0,'highpass',t);

  BGM.next+=spb;BGM.step++}}

let curCards=[];
function genCards(){const L=SAVE.meta.luck;const wts=[Math.max(20,60-L*5),28+L*2,10+L*2,2+L];
 const roll=()=>{let s=wts.reduce((a,b)=>a+b),r=Math.random()*s;for(let i=0;i<4;i++)if((r-=wts[i])<0)return i;return 0};
 const out=[];let g=0;while(out.length<3&&g++<80){const r=roll();let pool=[];
  if(r<=2)STATC.forEach(c=>pool.push({kind:'stat',c,r,key:'s'+c.id}));
  SPECC.forEach(c=>{if(c.r===r&&!G.owned.has(c.id))pool.push({kind:'spec',c,r,key:'p'+c.id})});
  if(r===1&&G.skills.length<4)Object.keys(SKILLS).forEach(id=>{if(!G.skills.find(s=>s.id===id))for(let k=0;k<3;k++)pool.push({kind:'skill',id,r,isNew:true,key:'k'+id})});
  if(r>=1)G.skills.forEach(s=>{if(s.lv>=5&&evS(s)<5)for(let k=0;k<4;k++)pool.push({kind:'skill',id:s.id,r:evS(s)>=4?3:2,evo:true,key:'e'+s.id})});
  if(r<=1)G.skills.forEach(s=>{if(s.lv<5)for(let k=0;k<3;k++)pool.push({kind:'skill',id:s.id,r,up:Math.min(r===0?1:2,5-s.lv),key:'k'+s.id})});
  pool=pool.filter(p=>!out.some(o=>o.key===p.key));if(pool.length)out.push(pick(pool))}
 if(!G.skills.length&&!out.some(o=>o.isNew)){const ids=Object.keys(SKILLS);const pickId=pick(ids.filter(id=>!out.some(o=>o.key==='k'+id)));out[0]={kind:'skill',id:pickId,r:1,isNew:true,key:'k'+pickId}}
 return out}
function cardInfo(cd){if(cd.kind==='stat')return{icon:cd.c.icon,name:cd.c.name,d:cd.c.d(cd.c.v[cd.r])};if(cd.kind==='spec')return{icon:cd.c.icon,name:cd.c.name,d:cd.c.d};
 const D=SKILLS[cd.id];if(cd.evo){const cur=evS(G.skills.find(x=>x.id===cd.id)),nx=cur+1;return{icon:D.icon,name:(nx>=5?SEVO[cd.id].fin:SEVO[cd.id].name)+' '+stars(nx),d:(nx>=5?'최종 진화! ':'')+SEVO[cd.id].d+' · 피해 +'+(nx*20)+'%',tag:(nx>=5?'★ 최종 진화':'★ 스킬 진화 '+nx+'단계')+' ('+D.name+')'}}if(cd.isNew)return{icon:D.icon,name:D.name,d:D.desc,tag:'NEW 스킬'};const s=G.skills.find(x=>x.id===cd.id);return{icon:D.icon,name:D.name+' +'+cd.up,d:`Lv${s.lv} → Lv${s.lv+cd.up} · ${D.up}`,tag:'스킬 강화'}}
