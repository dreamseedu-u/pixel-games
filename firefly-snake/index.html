<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10182b">
<title>반딧불 뱀 탐험대</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:#10182b;color:#fff9df;font-family:system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:max(12px,env(safe-area-inset-top)) 12px auto;display:flex;align-items:start;justify-content:space-between;gap:8px;pointer-events:none}
.chip,#pause{background:#141e32ec;border:1px solid #ffffff38;border-radius:12px;padding:9px 12px;box-shadow:0 3px #070e1b80}
#pause{pointer-events:auto;min-height:44px}
#progress{height:5px;border-radius:5px;background:#3c4155;margin-top:6px;overflow:hidden}
#progress b{display:block;height:100%;background:#b5eb79}
#hint{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);text-align:center;width:max-content;max-width:94%;pointer-events:none;font-size:14px}
#toast{position:absolute;top:25%;left:50%;transform:translateX(-50%);padding:8px 14px;background:#111b31eb;border-radius:10px;text-align:center;pointer-events:none}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#090f1caa;padding:16px;overflow:auto}
#overlay[hidden],#hud[hidden],#toast[hidden],#hint[hidden]{display:none}
#panel{width:min(100%,420px);max-height:100%;overflow:auto;border:2px solid #58707a;border-radius:22px;padding:clamp(16px,5vw,28px);background:#17243a;box-shadow:0 6px #090f1c;text-align:center}
h1,h2,p{margin:0 0 12px} h1{font-size:clamp(26px,7vw,39px);letter-spacing:-.06em}
p{line-height:1.55;color:#d1d9e3}
.actions{display:grid;gap:9px;margin-top:18px}
.actions button{background:#273a54;border:1px solid #63758c;border-radius:11px;min-height:47px;padding:9px;font-weight:700}
.actions button.primary{background:#bee97a;color:#17243a;border-color:#d0f2a5}
#emblem{display:flex;justify-content:center;margin:0 0 16px}
#emblem i{display:block;background:#8bc661;width:28px;height:24px;border:3px solid #233d3e;box-shadow:inset 0 5px #c9ed88;border-radius:7px;margin-right:-5px}
#emblem i:last-child{background:#c9ed88;width:34px;position:relative;box-shadow:inset 0 -6px #8bc661}
#emblem i:last-child::after{content:'';position:absolute;right:4px;top:5px;width:4px;height:5px;background:#263549;box-shadow:0 8px #263549}
</style>
</head>
<body>
<canvas id="field" aria-label="반딧불 뱀 경기장"></canvas>
<div id="hud" hidden><div id="stats" class="chip" aria-live="off"></div><button id="pause">일시정지</button></div>
<div id="toast" role="status" hidden></div><div id="hint" class="chip" hidden></div>
<div id="overlay"><section id="panel" role="dialog" aria-modal="true" aria-labelledby="title"></section></div>
<script>
'use strict';
const canvas = document.querySelector('#field');
const ctx = canvas.getContext('2d');
const overlay = document.querySelector('#overlay');
const panel = document.querySelector('#panel');
const hud = document.querySelector('#hud');
const stats = document.querySelector('#stats');
const hint = document.querySelector('#hint');
const toast = document.querySelector('#toast');
const keys = new Set();
const touches = new Map();
const TAU = Math.PI * 2;
const W = 1080;
const H = 1440;
const palette = ['#b5eb79', '#7de7f5', '#ff947c', '#ba9af8', '#ffc978'];
const relics = ['달빛 씨앗', '용암 유리', '불씨 왕관'];
let save = { best: 0, relics: [], skin: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('firefly-snake-v1'))); } catch {}
let width, height, zoom, offsetX, offsetY;
let players = [], rivals = [], food = [], sparks = [], rings = [];
let state = 'menu', mode = 1, stage = 0, elapsed = 0, stageTime = 0;
let rivalTimer = 0, defeats = 0, caveDefeats = 0, noticeUntil = 0, lastHud = -1;
const random = (min, max) => min + Math.random() * (max - min);
const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const living = snakes => snakes.filter(snake => snake.alive);

function persist() {
  try { localStorage.setItem('firefly-snake-v1', JSON.stringify(save)); } catch {}
}
function resize() {
  width = canvas.clientWidth;
  height = canvas.clientHeight;
  const ratio = Math.min(2, devicePixelRatio || 1);
  canvas.width = width * ratio;
  canvas.height = height * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();
function dialog(title, content, actions, emblem = false) {
  touches.clear();
  keys.clear();
  overlay.hidden = false;
  panel.innerHTML = (emblem ? '<div id="emblem" aria-hidden="true"><i></i><i></i><i></i><i></i></div>' : '') +
    '<h1 id="title">' + title + '</h1><p>' + content + '</p><div class="actions"></div>';
  const list = panel.querySelector('.actions');
  actions.forEach(([label, act], index) => {
    const button = document.createElement('button');
    button.textContent = label;
    if (!index) button.className = 'primary';
    button.onclick = act;
    list.append(button);
  });
  list.firstElementChild?.focus({ preventScroll: true });
}
function menu() {
  state = 'menu';
  hud.hidden = hint.hidden = toast.hidden = true;
  dialog('반딧불 뱀 탐험대', '빛나는 먹이를 모으고, 상대 뱀의 길을 막아 몸집을 키워요.<br>레벨 6부터 첫 자동 기술을 배워요.', [
    ['혼자 탐험', () => start(1)], ['둘이 같이 탐험', () => start(2)],
    ['보물 수집함 · ' + save.relics.length + '/' + relics.length, collection]
  ], true);
}
function collection() {
  state = 'collection';
  hud.hidden = hint.hidden = toast.hidden = true;
  dialog('보물 수집함', relics.map(name => save.relics.includes(name) ? '◆ ' + name : '◇ 미발견 보물').join('<br>') +
    '<br><br>최고 길이 ' + save.best + '마디', [
      ...(save.relics.length === relics.length ? [[save.skin ? '연두색 뱀으로 바꾸기' : '불씨 스킨 입기', () => {
        save.skin = !save.skin;
        persist();
        collection();
      }]] : []), ['처음으로', menu]
    ]);
}
function snake(x, y, heading, color, player) {
  return {
    x, y, heading, color, player, alive: true, length: 7, xp: 0, level: 1, skill: '',
    cooldown: 0, shield: player === undefined ? 2 : 5, spacing: 13,
    body: Array.from({length: 7}, (_, i) => ({
      x: x - Math.cos(heading) * 13 * (i + 1), y: y - Math.sin(heading) * 13 * (i + 1)
    }))
  };
}
function spawnRival() {
  const side = Math.floor(random(0, 4));
  const x = side < 2 ? (side ? W - 92 : 92) : random(110, W - 110);
  const y = side < 2 ? random(110, H - 110) : (side === 2 ? 92 : H - 92);
  const rival = snake(x, y, Math.atan2(H / 2 - y, W / 2 - x), palette[Math.floor(random(2, 5))]);
  rival.turn = 0;
  rival.cautious = Math.random() < .55;
  rivals.push(rival);
}
function seedFood(n) {
  for (let i = 0; i < n; i++) food.push({ x: random(35, W - 35), y: random(35, H - 35), value: 1 });
}
function start(count) {
  mode = count;
  stage = 0;
  elapsed = stageTime = defeats = caveDefeats = rivalTimer = 0;
  lastHud = -1;
  players = [snake(W / 2 - (count === 2 ? 52 : 0), H / 2, -Math.PI / 2, save.skin ? '#ff9a55' : palette[0], 0)];
  if (count === 2) players.push(snake(W / 2 + 52, H / 2, Math.PI / 2, palette[1], 1));
  rivals = [];
  food = [];
  sparks = [];
  rings = [];
  seedFood(110);
  for (let i = 0; i < 5; i++) spawnRival();
  resume();
  notify(count === 2 ? '왼쪽과 오른쪽을 나눠 드래그하세요' : '상대의 머리가 내 몸통에 닿도록 길을 막아요', 5);
}
function resume() {
  state = 'play';
  document.activeElement?.blur();
  overlay.hidden = true;
  hud.hidden = hint.hidden = false;
  hint.textContent = mode === 2 ? '왼쪽 · 1P  |  오른쪽 · 2P' : '누른 곳에서 드래그해 이동';
}
function pause() {
  if (state !== 'play') return;
  state = 'pause';
  dialog('일시정지', mode === 2 ? '키보드에서는 1P WASD · 2P 방향키를 사용해요.' : '키보드에서는 방향키 또는 WASD로 움직여요.', [
    ['계속하기', resume], ['처음으로', menu]
  ]);
}
document.querySelector('#pause').onclick = pause;
function notify(message, seconds = 3) {
  toast.textContent = message;
  toast.hidden = false;
  noticeUntil = elapsed + seconds;
}
function discover(name) {
  if (save.relics.includes(name)) return;
  save.relics.push(name);
  persist();
  notify('보물 발견 · ' + name);
}
function chooseSkill(snake) {
  state = 'skill';
  dialog(mode === 2 ? (snake.player + 1) + 'P · 첫 자동 기술' : '첫 자동 기술', '레벨 6에 도달했어요. 이번 탐험에 쓸 기술을 골라요.', [
    ['반딧불 고리 · 가까운 상대를 밀어내요', () => { snake.skill = 'ring'; resume(); }],
    ['별빛 화살 · 먼 상대를 겨눠요', () => { snake.skill = 'bolt'; resume(); }]
  ]);
}
function point(event) {
  return { x: event.clientX, y: event.clientY };
}
canvas.addEventListener('pointerdown', event => {
  if (state !== 'play') return;
  const p = point(event);
  const player = mode === 2 && p.x >= width / 2 ? 1 : 0;
  if ([...touches.values()].some(touch => touch.player === player)) return;
  touches.set(event.pointerId, { start: p, current: p, player });
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  const touch = touches.get(event.pointerId);
  if (touch) touch.current = point(event);
});
for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(name, event => touches.delete(event.pointerId));
}
const moveKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'];
window.addEventListener('keydown', event => {
  if (event.code === 'Escape') {
    if (state === 'pause') resume();
    else pause();
  }
  if (state === 'play' && moveKeys.includes(event.code)) {
    event.preventDefault();
    keys.add(event.code);
  }
});
window.addEventListener('keyup', event => keys.delete(event.code));
window.addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function control(s) {
  const arrows = s.player === 1 || mode === 1;
  const wasd = s.player === 0;
  const held = (arrow, letter) => (arrows && keys.has(arrow)) || (wasd && keys.has(letter));
  const touch = [...touches.values()].find(t => t.player === s.player);
  if (touch) {
    const x = touch.current.x - touch.start.x;
    const y = touch.current.y - touch.start.y;
    if (Math.hypot(x, y) > 5) return Math.atan2(y, x);
  }
  const x = Number(held('ArrowRight', 'KeyD')) - Number(held('ArrowLeft', 'KeyA'));
  const y = Number(held('ArrowDown', 'KeyS')) - Number(held('ArrowUp', 'KeyW'));
  return x || y ? Math.atan2(y, x) : null;
}
function steer(s, snakes, dt) {
  s.turn -= dt;
  if (s.turn <= 0) {
    s.turn = random(.25, .48);
    const nearby = food.filter(f => distance(s, f) < 190);
    const target = nearby.length ? nearby.reduce((a, b) => distance(s, a) < distance(s, b) ? a : b) :
      { x: W / 2 + random(-290, 290), y: H / 2 + random(-390, 390) };
    s.goal = Math.atan2(target.y - s.y, target.x - s.x) + random(-.23, .23);
  }
  const look = { x: s.x + Math.cos(s.heading) * 58, y: s.y + Math.sin(s.heading) * 58 };
  if (look.x < 38 || look.y < 38 || look.x > W - 38 || look.y > H - 38) {
    return Math.atan2(H / 2 - s.y, W / 2 - s.x);
  }
  for (const other of snakes) {
    if (other === s || distance(s, other) > other.length * 13 + 75) continue;
    if (other.body.some(part => distance(look, part) < 14) && s.cautious) {
      s.goal = s.heading + 1.2;
      return s.goal;
    }
  }
  return s.goal;
}
function advance(s, target, dt) {
  s.shield = Math.max(0, s.shield - dt);
  if (target !== null) {
    const delta = Math.atan2(Math.sin(target - s.heading), Math.cos(target - s.heading));
    s.heading += clamp(delta, -4.6 * dt, 4.6 * dt);
  }
  const speed = s.player === undefined ? 90 + stage * 14 : 133;
  const x = s.x + Math.cos(s.heading) * speed * dt;
  const y = s.y + Math.sin(s.heading) * speed * dt;
  if (x < 18 || x > W - 18) s.heading = Math.PI - s.heading;
  if (y < 18 || y > H - 18) s.heading = -s.heading;
  s.x = clamp(x, 18, W - 18);
  s.y = clamp(y, 18, H - 18);
  let previous = s;
  for (const part of s.body) {
    const d = distance(part, previous);
    if (d > s.spacing) {
      const scale = s.spacing / d;
      part.x = previous.x + (part.x - previous.x) * scale;
      part.y = previous.y + (part.y - previous.y) * scale;
    }
    previous = part;
  }
}
function grow(s, value) {
  s.xp += value;
  if (s.player !== undefined) {
    s.level = 1 + Math.floor(s.xp / 8);
  }
  const length = Math.min(s.player === undefined ? 24 : 68, 7 + Math.floor(s.xp / 3));
  while (s.body.length < length) s.body.push({ ...s.body.at(-1) });
  s.length = length;
  if (s.player !== undefined && length > save.best) {
    save.best = length;
    persist();
  }
}
function scatter(s, owner) {
  s.alive = false;
  for (let i = 0; i < s.body.length; i += 2) {
    const part = s.body[i];
    food.push({x: part.x + random(-6, 6), y: part.y + random(-6, 6), value: 3});
  }
  if (owner?.player !== undefined && s.player === undefined) {
    defeats++;
    if (defeats === 1) discover('달빛 씨앗');
    if (stage === 1 && ++caveDefeats === 5) discover('불씨 왕관');
  }
}
function collide(snakes) {
  const collisions = new Map();
  for (const s of snakes) {
    if (s.shield) continue;
    for (const other of snakes) {
      if (s === other || (s.player !== undefined && other.player !== undefined)) continue;
      if (distance(s, other) > other.length * 13 + 22) continue;
      if (other.body.slice(1).some(part => distance(s, part) < 15)) {
        collisions.set(s, other);
        break;
      }
    }
  }
  for (const [s, owner] of collisions) scatter(s, owner);
}
function useSkill(player, dt) {
  if (!player.skill) return;
  player.cooldown -= dt;
  if (player.cooldown > 0) return;
  const targets = living(rivals).filter(r => !r.shield);
  if (player.skill === 'ring') {
    player.cooldown = 4.5;
    rings.push({x: player.x, y: player.y, life: .45});
    for (const target of targets) {
      if (distance(player, target) > 88) continue;
      target.heading = Math.atan2(target.y - player.y, target.x - player.x);
      target.goal = target.heading;
      target.turn = .85;
      target.x = clamp(target.x + Math.cos(target.heading) * 32, 18, W - 18);
      target.y = clamp(target.y + Math.sin(target.heading) * 32, 18, H - 18);
      if (target.length > 7) {
        const tip = target.body.pop();
        target.xp = Math.max(0, target.xp - 3);
        target.length = target.body.length;
        food.push({...tip, value: 3});
      }
    }
  } else {
    const target = targets.filter(r => distance(player, r) < 270).sort((a,b) => distance(player,a) - distance(player,b))[0];
    if (!target) return;
    player.cooldown = 3.5;
    const angle = Math.atan2(target.y - player.y, target.x - player.x);
    sparks.push({x: player.x, y: player.y, vx: Math.cos(angle) * 360, vy: Math.sin(angle) * 360, life: .85, owner: player});
  }
}
function end(won) {
  state = 'end';
  dialog(won ? '탐험 완료!' : '이번 탐험이 끝났어요',
    '최고 길이 ' + Math.max(...players.map(s => s.length)) + '마디 · 상대 뱀 ' + defeats + '마리<br>모은 보물 ' + save.relics.length + '/' + relics.length, [
      ['다시 탐험', () => start(mode)], ['보물 수집함', collection], ['처음으로', menu]
    ]);
}
function enterCave() {
  stage = 1;
  stageTime = 0;
  food = [];
  rivals = [];
  sparks = [];
  rings = [];
  for (const s of living(players)) {
    const position = snake(W / 2 + (s.player ? 58 : -58), H / 2, -Math.PI / 2, s.color, s.player);
    s.x = position.x;
    s.y = position.y;
    s.heading = position.heading;
    s.body = position.body;
    while (s.body.length < s.length) s.body.push({...s.body.at(-1)});
    s.shield = 4;
  }
  seedFood(120);
  for (let i = 0; i < 7; i++) spawnRival();
  discover('용암 유리');
  notify('용암굴 도착 · 60초 동안 살아남아요!', 5);
}
function update(dt) {
  elapsed += dt;
  stageTime += dt;
  if (elapsed > noticeUntil) toast.hidden = true;
  const snakes = living([...players, ...rivals]);
  for (const s of snakes) advance(s, s.player === undefined ? steer(s, snakes, dt) : control(s), dt);
  collide(snakes);
  for (const s of snakes) {
    if (!s.alive) continue;
    for (let i = food.length - 1; i >= 0; i--) {
      if (distance(s, food[i]) < 23) grow(s, food.splice(i, 1)[0].value);
    }
    if (s.player !== undefined) useSkill(s, dt);
  }
  for (const spark of sparks) {
    spark.x += spark.vx * dt;
    spark.y += spark.vy * dt;
    spark.life -= dt;
    const target = living(rivals).find(r => !r.shield && distance(spark, r) < 18);
    if (target && spark.life > 0) {
      if (target.tagged) scatter(target, spark.owner);
      else { target.tagged = true; target.turn = 1; target.goal = target.heading + 1.3; }
      spark.life = 0;
    }
  }
  sparks = sparks.filter(s => s.life > 0);
  rings = rings.filter(ring => (ring.life -= dt) > 0);
  rivals = living(rivals);
  if (!living(players).length) { end(false); return; }
  if (stage === 1 && stageTime >= 60) { end(true); return; }
  if (stage === 0 && elapsed >= 65 && living(players).some(s => s.level >= 6)) enterCave();
  const awaiting = living(players).find(s => s.level >= 6 && !s.skill);
  if (awaiting) chooseSkill(awaiting);
  rivalTimer += dt;
  if (rivalTimer > 1.3) {
    rivalTimer = 0;
    if (rivals.length < (stage ? 8 : 6)) spawnRival();
    if (food.length < 110) seedFood(Math.min(12, 110 - food.length));
  }
  const tick = Math.floor(elapsed * 5);
  if (tick !== lastHud) {
    lastHud = tick;
    const status = players.map((s, i) => (mode === 2 ? (i + 1) + 'P ' : '') +
      (s.alive ? 'Lv.' + s.level + ' · ' + s.length + '마디' : '탈락')).join(' / ');
    stats.innerHTML = (stage ? '용암굴 · ' + Math.max(0, Math.ceil(60 - stageTime)) + '초' : '반딧불 숲') +
      '<br>' + status + '<div id="progress" aria-hidden="true"><b style="width:' + (players[0].xp % 8 * 12.5) + '%"></b></div>';
  }
}

function block(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}
function pixelGem(x, y, radius, color) {
  block(x - radius, y - radius + 2, radius * 2, radius * 2 - 4, color);
  block(x - radius + 2, y - radius, radius * 2 - 4, radius * 2, color);
  block(x - radius + 2, y - radius + 2, 3, 3, '#fff9df');
}
function drawSnake(s) {
  for (let i = s.body.length - 1; i >= 0; i--) {
    const p = s.body[i];
    const r = i > s.body.length - 4 ? 7 : 9;
    block(p.x - r, p.y - r + 4, r * 2, r * 2, '#10162a');
    pixelGem(p.x, p.y, r, s.color);
    block(p.x - r + 2, p.y + r - 4, r * 2 - 4, 3, '#17233a50');
  }
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.heading);
  pixelGem(0, 0, 13, s.color);
  block(4, -8, 5, 5, '#171e31');
  block(4, 3, 5, 5, '#171e31');
  block(5, -8, 2, 2, '#fff');
  block(5, 3, 2, 2, '#fff');
  ctx.restore();
  if (s.shield > 0 && s.player !== undefined) {
    ctx.strokeStyle = '#eefad3a0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 19, 0, TAU);
    ctx.stroke();
  }
  if (s.player !== undefined && mode === 2) {
    ctx.fillStyle = '#fff9df';
    ctx.font = 'bold 15px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText((s.player + 1) + 'P', s.x, s.y - 22);
  }
}
function drawMap() {
  const left = Math.max(0, Math.floor(-offsetX / zoom / 40) * 40);
  const top = Math.max(0, Math.floor(-offsetY / zoom / 40) * 40);
  const right = Math.min(W, (width - offsetX) / zoom + 40);
  const bottom = Math.min(H, (height - offsetY) / zoom + 40);
  for (let y = top; y < bottom; y += 40) {
    for (let x = left; x < right; x += 40) {
      const pattern = ((x * 17 + y * 31) ^ (x * y)) >>> 3;
      const colors = stage ? ['#3b2739', '#402a3d', '#432c40'] : ['#193b38', '#1d423e', '#204541'];
      block(x, y, 41, 41, colors[pattern % colors.length]);
      if (pattern % 7 === 0) {
        const px = x + 10 + pattern % 16;
        const py = y + 11;
        block(px, py, 3, 7, stage ? '#82505a' : '#4b7760');
        block(px - 3, py + 3, 9, 3, stage ? '#82505a' : '#4b7760');
      }
    }
  }
  ctx.strokeStyle = stage ? '#f07a59' : '#73a982';
  ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, W, H);
}
function draw() {
  ctx.fillStyle = stage ? '#24192a' : '#102a2c';
  ctx.fillRect(0, 0, width, height);
  const active = living(players);
  const focus = active.length ? active : players;
  const cx = focus.length ? focus.reduce((sum, s) => sum + s.x, 0) / focus.length : W / 2;
  const cy = focus.length ? focus.reduce((sum, s) => sum + s.y, 0) / focus.length : H / 2;
  zoom = clamp(Math.min(width / 590, height / 680), .42, 1.22);
  if (active.length === 2) {
    zoom = Math.min(zoom, width / (Math.abs(active[0].x - active[1].x) + 144),
      height / (Math.abs(active[0].y - active[1].y) + 200));
  }
  offsetX = W * zoom < width ? (width - W * zoom) / 2 : clamp(width / 2 - cx * zoom, width - W * zoom, 0);
  offsetY = H * zoom < height ? (height - H * zoom) / 2 : clamp(height / 2 - cy * zoom, height - H * zoom, 0);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(zoom, zoom);
  drawMap();
  for (const f of food) {
    const r = f.value === 1 ? 4 : 7;
    block(f.x - r - 4, f.y - r - 4, (r + 4) * 2, (r + 4) * 2, '#ffe08923');
    pixelGem(f.x, f.y, r, f.value === 1 ? '#e9d982' : '#ffb373');
  }
  for (const s of [...living(rivals), ...active]) drawSnake(s);
  for (const spark of sparks) pixelGem(spark.x, spark.y, 6, '#fff2a6');
  for (const ring of rings) {
    ctx.strokeStyle = 'rgba(209, 255, 142, ' + ring.life / .45 + ')';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(ring.x, ring.y, 8 + (.45 - ring.life) * 180, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
  for (const touch of touches.values()) {
    const dx = touch.current.x - touch.start.x;
    const dy = touch.current.y - touch.start.y;
    const scale = Math.min(1, 34 / (Math.hypot(dx, dy) || 1));
    for (const [x, y, r, color] of [
      [touch.start.x, touch.start.y, 35, '#f5fbeb48'],
      [touch.start.x + dx * scale, touch.start.y + dy * scale, 13, '#f5fbeb99']
    ]) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }
  }
}
menu();
let previousFrame;
function frame(time) {
  const dt = Math.min(.033, (time - (previousFrame ?? time)) / 1000);
  previousFrame = time;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
